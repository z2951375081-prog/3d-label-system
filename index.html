<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OBJ 3D Label Studio · 启动入口</title>
    <style>
      :root { --ink:#17233c; --muted:#7a879e; --line:#e4eaf3; --blue:#3975e6; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 20% 10%,#edf4ff 0,#f5f7fb 45%,#eef8f6 100%); color:var(--ink); font-family:Inter,"Microsoft YaHei",system-ui,sans-serif; }
      .card { width:min(620px,calc(100% - 32px)); padding:34px; border:1px solid var(--line); border-radius:20px; background:#fff; box-shadow:0 20px 60px rgba(39,61,98,.12); }
      .mark { width:48px; height:48px; display:grid; place-items:center; color:#fff; border-radius:14px; background:linear-gradient(145deg,#62a1ff,#5270ea); font-size:26px; box-shadow:0 10px 22px rgba(61,117,230,.24); }
      h1 { margin:20px 0 8px; font-size:26px; letter-spacing:-.5px; } p { color:var(--muted); font-size:13px; line-height:1.8; }
      .status { margin:22px 0 16px; padding:12px 14px; border-radius:10px; background:#f5f8fd; color:#647594; font-size:12px; }
      .status.ready { color:#168f82; background:#eafaf6; } .status.warn { color:#aa701e; background:#fff7e8; }
      .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
      a, button { height:40px; padding:0 16px; border:0; border-radius:9px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; text-decoration:none; }
      .primary { display:inline-flex; align-items:center; color:#fff; background:var(--blue); box-shadow:0 8px 18px rgba(57,117,230,.2); }
      .secondary { color:#5d6d87; background:#f0f4fa; } .secondary:hover { background:#e7eefb; color:var(--blue); }
      code { padding:3px 6px; border-radius:5px; color:#4d70b4; background:#f0f4fb; }
      .note { margin-top:22px; padding-top:17px; border-top:1px solid var(--line); font-size:11px; color:#99a5b7; line-height:1.7; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">◈</div>
      <h1>OBJ 3D Label Studio</h1>
      <p>3D 标签生成、五视角可视化、人工布局对比与本地偏好训练工作台。</p>
      <div id="status" class="status">正在检查本地计算服务……</div>
      <div class="actions">
        <a class="primary" href="http://localhost:5173/">打开 3D 标签工作台</a>
        <button id="retry" class="secondary" type="button">重新检查服务</button>
      </div>
      <div class="note">本入口可以直接双击打开。完整系统的模型计算由本机 Node 服务执行；如果按钮无法打开，请在项目文件夹中运行 <code>npm start</code>，再点击“打开 3D 标签工作台”。</div>
    </main>
    <script>
      const serviceUrl = 'http://localhost:5173/';
      const status = document.getElementById('status');
      async function checkService() {
        status.className = 'status';
        status.textContent = '正在检查本地计算服务……';
        try {
          await fetch(serviceUrl, { mode: 'no-cors', cache: 'no-store' });
          status.className = 'status ready';
          status.textContent = '本地服务已运行，可以打开完整工作台。';
        } catch {
          status.className = 'status warn';
          status.textContent = '尚未检测到本地服务。请先运行 npm start，再点击上方按钮。';
        }
      }
      document.getElementById('retry').addEventListener('click', checkService);
      checkService();
    </script>
  </body>
</html>
