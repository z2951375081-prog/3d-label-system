<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1690" viewBox="0 0 760 1690"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#9aa3aa"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8ca0b3" flood-opacity="0.13"/></filter></defs><style>svg{background:#fff}.title{font:700 28px Microsoft YaHei,Noto Sans SC,Arial,sans-serif;fill:#274866}.subtitle{font:500 14px Microsoft YaHei,Noto Sans SC,Arial,sans-serif;fill:#7b8b99}.box-text{font:700 17px Microsoft YaHei,Noto Sans SC,Arial,sans-serif;fill:#2791ff}.edge{fill:none;stroke:#9aa3aa;stroke-width:1.5;marker-end:url(#arrow)}rect{filter:url(#shadow)}</style><rect width="760" height="1690" fill="#ffffff"/><text class="title" x="380" y="42" text-anchor="middle">BinoForce 方法架构</text><text class="subtitle" x="380" y="76" text-anchor="middle">双目视点下的动态五力布局复现</text><path d="M 190 212 V 232 H 380 V 254" class="edge"/><path d="M 570 212 V 232 H 380 V 254" class="edge"/><line x1="380" y1="348" x2="380" y2="390" class="edge"/><line x1="380" y1="484" x2="380" y2="526" class="edge"/><line x1="380" y1="612" x2="380" y2="654" class="edge"/><line x1="380" y1="786" x2="380" y2="828" class="edge"/><line x1="380" y1="934" x2="380" y2="976" class="edge"/><line x1="380" y1="1068" x2="380" y2="1110" class="edge"/><line x1="380" y1="1204" x2="380" y2="1246" class="edge"/><line x1="380" y1="1340" x2="380" y2="1382" class="edge"/><line x1="380" y1="1468" x2="380" y2="1510" class="edge"/><g><rect x="50" y="126" width="280" height="86" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="190" y="176">3D 场景 + OBJ 几何</tspan></text></g><g><rect x="430" y="126" width="280" height="86" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="570" y="176">标签、锚点与尺寸</tspan></text></g><g><rect x="210" y="254" width="340" height="94" rx="24" fill="#e8f8f2" stroke="#c3e3d7" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="295.5">左右眼虚拟相机</tspan><tspan x="380" y="320.5">IPD = 0.064 m</tspan></text></g><g><rect x="210" y="390" width="340" height="94" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="431.5">确定性动态相机轨迹</tspan><tspan x="380" y="456.5">30 FPS 分段移动/暂停</tspan></text></g><g><rect x="230" y="526" width="300" height="86" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="576">标签从锚点初始化</tspan></text></g><g><rect x="130" y="654" width="500" height="132" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="702">五类布局力</tspan><tspan x="380" y="727">排斥 · 吸引 · 双目重叠</tspan><tspan x="380" y="752">引导线交叉 · 圆形力</tspan></text></g><g><rect x="155" y="828" width="450" height="106" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="875.5">加权合力</tspan><tspan x="380" y="900.5">0.02 / 0.09 / 0.06 / 0.8 / 0.03</tspan></text></g><g><rect x="220" y="976" width="320" height="92" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="1016.5">逐帧位移更新</tspan><tspan x="380" y="1041.5">labels += force × 0.01</tspan></text></g><g><rect x="210" y="1110" width="340" height="94" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="1151.5">Warm-up 800 帧</tspan><tspan x="380" y="1176.5">进入稳定布局</tspan></text></g><g><rect x="205" y="1246" width="350" height="94" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="1287.5">Camera-facing 标签投影</tspan><tspan