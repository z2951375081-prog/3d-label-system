<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1530" viewBox="0 0 760 1530"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#9aa3aa"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8ca0b3" flood-opacity="0.13"/></filter></defs><style>svg{background:#fff}.title{font:700 28px Microsoft YaHei,Noto Sans SC,Arial,sans-serif;fill:#274866}.subtitle{font:500 14px Microsoft YaHei,Noto Sans SC,Arial,sans-serif;fill:#7b8b99}.box-text{font:700 17px Microsoft YaHei,Noto Sans SC,Arial,sans-serif;fill:#2791ff}.edge{fill:none;stroke:#9aa3aa;stroke-width:1.5;marker-end:url(#arrow)}rect{filter:url(#shadow)}</style><rect width="760" height="1530" fill="#ffffff"/><text class="title" x="380" y="42" text-anchor="middle">Hedgehog 3D 方法架构</text><text class="subtitle" x="380" y="76" text-anchor="middle">径向 Pole + 局部图像平面三自由度优化</text><path d="M 190 212 V 232 H 380 V 254" class="edge"/><path d="M 570 212 V 232 H 380 V 254" class="edge"/><line x1="380" y1="346" x2="380" y2="388" class="edge"/><line x1="380" y1="482" x2="380" y2="524" class="edge"/><line x1="380" y1="616" x2="380" y2="658" class="edge"/><line x1="380" y1="750" x2="380" y2="792" class="edge"/><line x1="380" y1="910" x2="380" y2="952" class="edge"/><line x1="380" y1="1062" x2="380" y2="1104" class="edge"/><line x1="380" y1="1190" x2="380" y2="1232" class="edge"/><line x1="380" y1="1326" x2="380" y2="1368" class="edge"/><g><rect x="45" y="126" width="290" height="86" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="190" y="176">OBJ / 包围球几何</tspan></text></g><g><rect x="425" y="126" width="290" height="86" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="570" y="176">人工标签锚点与尺寸</tspan></text></g><g><rect x="205" y="254" width="350" height="92" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="307">物体包围球中心 + Anchor</tspan></text></g><g><rect x="190" y="388" width="380" height="94" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="429.5">构造径向 Hedgehog Pole</tspan><tspan x="380" y="454.5">center → anchor</tspan></text></g><g><rect x="210" y="524" width="340" height="92" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="564.5">最小 Pole 长度初始化</tspan><tspan x="380" y="589.5">0.08 × 物体对角线</tspan></text></g><g><rect x="205" y="658" width="350" height="92" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="698.5">投影到当前视角</tspan><tspan x="380" y="723.5">标签矩形与引导线</tspan></text></g><g><rect x="155" y="792" width="450" height="118" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="833">屏幕空间布局力</tspan><tspan x="380" y="858">标签排斥 · 物体避让 · 锚点遮挡</tspan><tspan x="380" y="883">引导线交叉 · 回拉力</tspan></text></g><g><rect x="160" y="952" width="440" height="110" rx="24" fill="#e8f8f2" stroke="#c3e3d7" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="989">3DOF 更新</tspan><tspan x="380" y="1014">Pole 长度 + 局部图像平面 X/Y</tspan><tspan x="380" y="1039">X/Y 位移限制在标签尺寸内</tspan></text></g><g><rect x="220" y="1104" width="320" height="86" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="1154">确定性迭代 80 次</tspan></text></g><g><rect x="200" y="1232" width="360" height="94" rx="24" fill="#e4f2ff" stroke="#cbdbe9" stroke-width="1.6"/><text class="box-text" text-anchor="middle"><tspan x="380" y="1286">反投影回 3D 标签中心</tspan></text></g><g><rect x="230" y="1368" width="300" height="92"